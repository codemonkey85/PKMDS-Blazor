name: Build and Test

on:
  workflow_dispatch:
  push:
    branches: [ dev ]
    paths-ignore:
      - "**.md"
      - "**.ps1"
      - ".editorconfig"
      - "TestFiles/*"
      - '**/*.gitignore'
      - '**/*.gitattributes'
      - '**/*.yml'
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened, ready_for_review]  # Also run when PR is marked ready for review

# Least-privilege GITHUB_TOKEN: this workflow only checks out and builds/tests.
permissions:
  contents: read

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    if: github.event_name != 'push' || github.event.pull_request == null  # Prevents duplicate runs

    steps:
      # uses GitHub's checkout action to checkout code form the release branch
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Verify published sprite collection
        run: node tools/sprites/verify-published.mjs

      # sets up .NET SDK
      - name: Setup .NET
        uses: actions/setup-dotnet@v6.1.0
        with:
          global-json-file: ./global.json

      - name: Install WASM workload
        run: dotnet workload install wasm-tools
  
      - name: Restore dependencies
        run: dotnet restore Pkmds.Web/Pkmds.Web.csproj -p:SelfContained=true

      - name: Publish Web
        run: dotnet publish Pkmds.Web/Pkmds.Web.csproj --configuration Release --no-restore -o release

      - name: Install browser smoke dependencies
        working-directory: tools/bench
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Verify published description loading in Chromium
        run: node tools/bench/run-bench.mjs --label ci-descriptions --site release/wwwroot --suite descriptions --runs 1 --compression br --output measurements/ci-descriptions.md

      - name: Upload description browser observations
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: description-browser-smoke
          path: measurements/ci-descriptions*
          if-no-files-found: ignore

      - name: Verify service worker assets
        run: node tools/verify-service-worker-assets.mjs release/wwwroot

      - name: Build Functions
        run: dotnet build Pkmds.Functions/Pkmds.Functions.csproj --configuration Release

      - name: Check legalization outcome prototype
        shell: pwsh
        run: |
          $project = 'tools/legalization-outcomes/LegalizationOutcomes.csproj'
          $probe = dotnet build $project -c Debug -p:DefineConstants=VERIFY_EXHAUSTIVENESS 2>&1 | Out-String
          if ($LASTEXITCODE -eq 0 -or $probe -notmatch 'error CS8509.*ImportedViaHaX' -or $probe -notmatch 'error CS8509.*ClosedHaX') {
            throw "Expected missing-case diagnostics for both prototypes: $probe"
          }
          dotnet run --project $project -c Release > legalization-outcomes.json
          if ($LASTEXITCODE -ne 0) { throw 'Legalization outcome prototype failed.' }

      - name: Upload legalization outcome observations
        uses: actions/upload-artifact@v7
        with:
          name: legalization-outcomes
          path: legalization-outcomes.json

      - name: Run tests
        run: dotnet test Pkmds.Tests/Pkmds.Tests.csproj --configuration Release

      - name: Test JavaScript behavior
        run: node --test tools/tests/service-worker-sprites.test.mjs tools/tests/sprite-upstream.test.mjs tools/tests/sprite-publication.test.mjs tools/tests/browse-autocomplete.test.mjs tools/tests/razor-control-parser.test.mjs tools/tests/benchmark-isolation.test.mjs tools/tests/browser-support.test.mjs tools/tests/browser-memory.test.mjs
